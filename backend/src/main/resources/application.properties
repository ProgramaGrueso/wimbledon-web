# =====================================================================
# Hotel Wimbledon — Backend Configuration
# =====================================================================
# IMPORTANTE: Este archivo contiene placeholders.
# Copia como application-local.properties y rellena con tus datos reales.
# application-local.properties está en .gitignore (no lo subas al repo).
# =====================================================================

spring.application.name=wimbledon-backend

# ── Base de datos ─────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hotel_wimbledon?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────
# validate: verifica que el schema SQL ya exista (tu hotel_wimbledon_test_db.sql)
# update: úsalo solo en desarrollo local si quieres que Hibernate ajuste tablas
# update: Hibernate crea/ajusta tablas según las entidades JPA.
# Nuestro modelo usa rol como VARCHAR directo (no FK a tabla roles del SQL original).
# Si corriste el SQL de prueba antes, borra la BD y deja que Hibernate la recree:
#   DROP DATABASE hotel_wimbledon; CREATE DATABASE hotel_wimbledon;
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Seguridad / JWT ───────────────────────────────────────────────────
# Clave secreta para firmar los JWT (mínimo 256 bits = 32 chars, en base64)
# Genera una segura con: openssl rand -base64 64
# Clave de prueba (64 bytes = 512 bits > 256 mínimo para HS256).
# REEMPLAZA en producción con: openssl rand -base64 64
wimbledon.jwt.secret=V2ltYmxlZG9uSG90ZWxTZWNyZXRLZXlGb3JKd3RTaWduaW5nMjAyNFBhc3N3b3JkU2VjdXJlRW5vdWdoISE=
# Expiración del token en milisegundos (86400000 = 24 horas)
wimbledon.jwt.expiration=86400000

# ── SMTP (correo de confirmación) ─────────────────────────────────────
# Opción A: Mailtrap (recomendado para pruebas — no envía correos reales)
#   Crear cuenta en https://mailtrap.io -> Sandbox Inbox -> SMTP Settings
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=TU_USUARIO_MAILTRAP
spring.mail.password=TU_CLAVE_MAILTRAP
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Remitente visible en el correo de confirmación
wimbledon.mail.from=reservas@wimbledon-hotel.test


# Opción B: Gmail con contraseña de aplicación (descomentar y comentar Opción A)
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=tu-correo@gmail.com
# spring.mail.password=tu-contrasena-de-aplicacion-16-chars
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

# ── URLs del sistema ──────────────────────────────────────────────────
# URL base del frontend para el enlace de check-in en el QR
wimbledon.checkin.base-url=https://wimbledon-web.vercel.app/checkin
# Horas antes del ingreso hasta donde se permite cancelar/reprogramar
wimbledon.reservas.horas-cancelacion=2
# Ventana de tiempo (en minutos) para confirmar una reserva PENDIENTE antes de ser cancelada
wimbledon.reservas.ventana-confirmacion-minutos=30
# Frecuencia en milisegundos para el job de expiración automática de reservas (60000 = cada 1 minuto)
wimbledon.reservas.intervalo-expiracion-ms=60000
# Máximo de reservas activas en estado PENDIENTE por usuario (email / teléfono)
wimbledon.reservas.max-pendientes=2

# ── Servidor ──────────────────────────────────────────────────────────
server.port=8080

# ── CORS (ajustar en producción a la URL real de Vercel) ──────────────
# Configurado en SecurityConfig.java, este valor es referencia
wimbledon.cors.allowed-origins=http://localhost:5173,https://wimbledon-web.vercel.app

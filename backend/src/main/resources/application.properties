# =====================================================================
# Hotel Wimbledon — Backend Configuration
# =====================================================================
# IMPORTANTE: Este archivo contiene placeholders.
# Copia como application-local.properties y rellena con tus datos reales.
# application-local.properties está en .gitignore (no lo subas al repo).
# =====================================================================

spring.application.name=wimbledon-backend
spring.profiles.active=local

# ── Base de datos ─────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://mysql-13429d1-juanganoza-6f84.l.aivencloud.com:17643/defaultdb?sslMode=REQUIRED&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Seguridad / JWT ───────────────────────────────────────────────────
# Clave secreta para firmar los JWT (mínimo 256 bits = 32 chars, en base64)
# Genera una segura con: openssl rand -base64 64
# Clave de prueba (64 bytes = 512 bits > 256 mínimo para HS256).
# REEMPLAZA en producción con: openssl rand -base64 64
wimbledon.jwt.secret=V2ltYmxlZG9uSG90ZWxTZWNyZXRLZXlGb3JKd3RTaWduaW5nMjAyNFBhc3N3b3JkU2VjdXJlRW5vdWdoISE=
# Expiración del token en milisegundos (86400000 = 24 horas)
wimbledon.jwt.expiration=86400000

# ── SMTP (correo de confirmación) ─────────────────────────────────────
# Opción A: Mailtrap (recomendado para pruebas — no envía correos reales)
#   Crear cuenta en https://mailtrap.io -> Sandbox Inbox -> SMTP Settings
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=TU_USUARIO_MAILTRAP
spring.mail.password=TU_CLAVE_MAILTRAP
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Remitente visible en el correo de confirmación
wimbledon.mail.from=reservas@wimbledon-hotel.test


# Opción B: Gmail con contraseña de aplicación (descomentar y comentar Opción A)
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=tu-correo@gmail.com
# spring.mail.password=tu-contrasena-de-aplicacion-16-chars
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

# ── URLs del sistema ──────────────────────────────────────────────────
# URL base del frontend para el enlace de check-in en el QR
wimbledon.checkin.base-url=https://wimbledon-web.vercel.app/checkin
# Horas de anticipacion ANTES del ingreso en las que el pase ya puede consumirse.
# Unidad: horas enteras. Desplaza SOLO el limite inferior de la ventana de validez.
# No alarga la ventana despues de hora_salida: el pase caduca al liberar la habitacion.
wimbledon.checkin.anticipacion-horas=4
# Horas antes del ingreso hasta donde se permite cancelar/reprogramar
wimbledon.reservas.horas-cancelacion=2
# Minutos que la suite queda retenida (PENDIENTE) mientras el huésped envía su voucher.
# Pasado este plazo sin validar el pago, el scheduler la cancela y libera el inventario.
wimbledon.reservas.ventana-confirmacion-minutos=15
# Frecuencia en milisegundos para el job de expiración automática de reservas (60000 = cada 1 minuto)
wimbledon.reservas.intervalo-expiracion-ms=60000
# Máximo de reservas activas en estado PENDIENTE por usuario (email / teléfono)
wimbledon.reservas.max-pendientes=2
# Máximo de reservas PENDIENTE simultáneas por IP de origen (anti bloqueo masivo)
wimbledon.reservas.max-pendientes-por-ip=1
# Días hacia adelante que se puede reservar desde el portal
wimbledon.reservas.dias-anticipacion-max=60

# ── Datos de pago (portal y notificación al huésped) ──────────────────
wimbledon.pago.titular=Hotel Wimbledon
wimbledon.pago.yape-plin=990370681
# WhatsApp que recibe los vouchers (formato internacional sin +)
wimbledon.pago.whatsapp=51990370681
# Cuentas bancarias: "Banco|Número|CCI" separadas por ';'. PENDIENTE: completar con las cuentas oficiales.
wimbledon.pago.cuentas=BCP|[pendiente]|[pendiente];BBVA|[pendiente]|[pendiente];Interbank|[pendiente]|[pendiente]

# ── Notificaciones al huésped (WhatsApp/SMS) ──────────────────────────
# "log" arma el mensaje y lo registra sin enviarlo. Para envío real, implementar el
# proveedor en NotificacionReservaService (Twilio / WhatsApp Business API).
wimbledon.notificaciones.proveedor=log

# Solo true si el backend corre detrás de un proxy propio que fija X-Forwarded-For.
wimbledon.proxy.confiar-x-forwarded-for=false

# ── Servidor ──────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8081}
server.address=127.0.0.1

# ── CORS (ajustar en producción a la URL real de Vercel) ──────────────
# Configurado en SecurityConfig.java, este valor es referencia
wimbledon.cors.allowed-origins=http://localhost:5173,https://wimbledon-web.vercel.app
